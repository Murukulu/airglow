[package]
name = "aifsv2"
version = "0.1.0"
edition = "2024"

[dependencies]
# "cubecl" re-exports the runtime as burn::cubecl, which is where the allocator lives:
# WgpuRuntime::client(&device).memory_usage(). Nothing else exposes GPU memory stats.
burn = { version = "0.21.0", features = ["store", "wgpu", "cubecl"] }
burn-store = "0.21.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
