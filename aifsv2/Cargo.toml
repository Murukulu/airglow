[package]
name = "aifsv2"
version = "0.1.0"
edition = "2024"

[dependencies]
# "cubecl" re-exports the runtime as burn::cubecl, which is where the allocator lives:
# WgpuRuntime::client(&device).memory_usage(). Nothing else exposes GPU memory stats.
burn = { version = "0.21.0", features = ["store", "wgpu", "cubecl"] }
burn-store = "0.21.0"
burn-cubecl = "0.21.0"
burn-fusion = "0.21.0"

chrono = "0.4.45"
# Bindings to ECMWF's libeccodes, which the dev shell supplies. The pure-Rust GRIB crates
# were tried first and none of them reads this data: lsm.grib is edition 1 on a reduced
# Gaussian grid, and all 137 forecast messages are grid_ccsds. docs/grib-to-inference-pipeline.md
# §8 has the comparison. Default features are only ndarray conversions, which we do not use.
eccodes = { version = "0.14.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
